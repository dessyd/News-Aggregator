name: Revue de presse quotidienne

on:
  schedule:
    # 05:00 UTC = 07:00 en été (CEST) / 06:00 en hiver (CET). GitHub peut retarder l'exécution de quelques minutes.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: revue-de-presse
  cancel-in-progress: false

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fédération d'identité : le SDK échange le jeton OIDC de GitHub contre un jeton d'accès Anthropic.
      # Aucun ANTHROPIC_API_KEY ici : il aurait priorité sur la fédération.
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/anthropic-identity-token
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jeton OIDC GitHub (fédération Anthropic)
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            require('fs').writeFileSync(process.env.ANTHROPIC_IDENTITY_TOKEN_FILE, token, { mode: 0o600 });

      - name: Générer la revue
        run: python -m src.main run

      - name: Publier (commit des pages et des données)
        run: |
          git config user.name "revue-bot"
          git config user.email "revue-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "Revue du $(date -u +%F)"
            git pull --rebase
            git push
          fi
