name: Revue de presse quotidienne

on:
  schedule:
    # 05:17 UTC (minute décalée : les cron « pile à l'heure » sont souvent retardés ou perdus) = 07:17 en été (CEST) / 06:17 en hiver (CET). GitHub peut retarder l'exécution de quelques minutes.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: revue-de-presse
  cancel-in-progress: false

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fédération d'identité : le SDK échange le jeton OIDC de GitHub contre un jeton d'accès Anthropic.
      # Aucun ANTHROPIC_API_KEY ici : il aurait priorité sur la fédération.
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/anthropic-identity-token
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jeton OIDC GitHub (fédération Anthropic), renouvelé en arrière-plan
        run: |
          bash .github/scripts/jeton-oidc.sh
          setsid nohup bash .github/scripts/jeton-oidc.sh --boucle >/dev/null 2>&1 &

      - name: Générer la revue
        run: python -m src.main run
        env:
          # Source NewsBlur (Le Soir). Facultatif : sans ces secrets, la source est signalée en échec sans interrompre la revue.
          NEWSBLUR_USERNAME: ${{ secrets.NEWSBLUR_USERNAME }}
          NEWSBLUR_PASSWORD: ${{ secrets.NEWSBLUR_PASSWORD }}

      - name: Publier (commit des pages et des données)
        run: |
          git config user.name "revue-bot"
          git config user.email "revue-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "Revue du $(date -u +%F)"
            git pull --rebase
            git push
          fi

  deploy:
    # Un push fait avec GITHUB_TOKEN ne déclenche pas la construction de Pages : on déploie explicitement docs/.
    needs: revue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
