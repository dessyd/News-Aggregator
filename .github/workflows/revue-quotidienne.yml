name: Revue de presse quotidienne

on:
  schedule:
    # 05:00 UTC = 07:00 en été (CEST) / 06:00 en hiver (CET). GitHub peut retarder l'exécution de quelques minutes.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revue-de-presse
  cancel-in-progress: false

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Générer la revue
        run: python -m src.main run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publier (commit des pages et des données)
        run: |
          git config user.name "revue-bot"
          git config user.email "revue-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "Revue du $(date -u +%F)"
            git pull --rebase
            git push
          fi
