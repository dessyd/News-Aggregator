# Liste des flux RSS. Modifiable librement (sans toucher au code).
#
# IMPORTANT : ces URL sont des points de départ. Elles n'ont pas toutes pu être
# vérifiées au moment de la création du projet. Lancez
#     python -m src.main check-feeds
# pour contrôler chaque flux, puis commentez (ou mettez enabled: false) ceux qui
# ne répondent pas. Seul le flux RTBF a été confirmé comme valide (20 entrées,
# extraits souvent tronqués).
#
# Champs : name (affiché dans la revue), url, lang (fr/en/nl), enabled.
# Au lieu de `url`, `url_env: NOM_DE_VARIABLE` lit l'adresse dans une variable d'environnement (secret GitHub) :
# à utiliser pour l'adresse d'un flux de sortie de lecteur, qui contient un jeton et ne doit jamais figurer dans ce dépôt public.

feeds:
  - name: RTBF Info
    url: https://rss.rtbf.be/article/rss/highlight_rtbf_info.xml
    lang: fr

  - name: Le Monde
    url: https://www.lemonde.fr/rss/une.xml
    lang: fr

  - name: France 24
    url: https://www.france24.com/fr/rss
    lang: fr
    enabled: false

  - name: RFI
    url: https://www.rfi.fr/fr/rss
    lang: fr
    enabled: false

  - name: franceinfo
    url: https://www.franceinfo.fr/titres.rss
    lang: fr
    enabled: false

  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    lang: en

  # Le Soir : le flux direct est bloqué par Akamai (403 le 2026-10-08, y compris avec un User-Agent de navigateur).
  # On lit le flux de sortie d'un dossier Inoreader (plan Pro) ne contenant que Le Soir ; son adresse, qui contient un jeton, est un secret (voir README).
  - name: Le Soir
    url_env: LESOIR_FEED_URL
    lang: fr

  - name: La Libre
    url: https://www.lalibre.be/arc/outboundfeeds/rss/?outputType=xml
    lang: fr

  - name: L'Echo
    url: https://www.lecho.be/rss/actualite.xml
    lang: fr

  - name: Le Vif
    url: https://www.levif.be/feed/
    lang: fr

  - name: VRT NWS (EN)
    url: https://www.vrt.be/vrtnws/en.rss.articles.xml
    lang: en

  # Testés le 2026-10-08, non retenus : DH (flux intitulé « Les Sports+ »), 7sur7 (sans extrait),
  # HLN et Bruzz (néerlandais), VRT NWS (NL). Bloqués ou invalides : Sudinfo (403), Brussels Times (XML invalide),
  # Belga et RTL Info (404 sur les URL essayées).
