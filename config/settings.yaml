# Paramètres techniques. Les consignes éditoriales sont dans le dossier prompts/.

rubriques:
  - Belgique
  - Europe
  - Monde
  - Politique
  - Économie
  - Société
  - Environnement
  - Sciences & Tech
  - Culture
  - Sport
  - Autres

collect:
  max_age_hours: 30            # ignorer les articles plus anciens
  max_articles_per_feed: 50    # plafond par flux (les plus récents)
  max_articles_total: 200      # plafond global (maîtrise du coût)
  extrait_max_chars: 600       # longueur max de l'extrait envoyé au modèle
  title_similarity: 0.88       # seuil (0-1) de détection de titres quasi identiques

# Un modèle par étape. Vérifiez les identifiants disponibles dans la documentation
# Anthropic (https://docs.claude.com/en/docs/about-claude/models) : ils évoluent.
# Étape 1 = beaucoup de petits textes -> modèle léger/économique.
# Étapes 2 à 4 = regroupement et rédaction -> modèle plus capable.
models:
  stage1: claude-haiku-4-5
  stage2: claude-sonnet-4-5
  stage3: claude-sonnet-4-5
  stage4: claude-sonnet-4-5

llm:
  temperature: null            # null = valeur par défaut du modèle (certains modèles refusent ce paramètre)
  workers: 4                   # appels simultanés
  batch_size: 25               # articles par appel à l'étape 1
  max_tokens_stage1: 4096
  max_tokens_stage2: 6000
  max_tokens_stage3: 1200
  max_tokens_stage4: 1200

digest:
  min_importance: 2            # en dessous, l'article n'entre pas dans le regroupement
  max_topics: 12               # nombre maximal de sujets développés
  max_articles_per_topic: 8
  breves_min_importance: 3     # un article isolé devient une brève à partir de cette note
  breves_max: 15

site:
  title: Revue de presse
  subtitle: Synthèse quotidienne générée à partir de flux RSS
  timezone: Europe/Brussels
  retention_days: 30           # durée de conservation des caches et essais (data/)
