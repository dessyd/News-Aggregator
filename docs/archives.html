<title>Archives — Revue de presse</title>
<style>
:root {
  --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff;
  --line: #e4e2dc; --accent: #1f5fbf; --chip-bg: #eef3fb;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --fg: #ecebe6; --muted: #a09f98; --card: #1f1f1d;
          --line: #33332f; --accent: #7fb0ff; --chip-bg: #232b38; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.6 Georgia, "Times New Roman", serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { font: 700 1.9rem/1.2 system-ui, sans-serif; margin: 0; }
header p { margin: 4px 0 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: .95rem; }
nav { margin-top: 10px; font: .9rem system-ui, sans-serif; }
a { color: var(--accent); }
.chapeau { font-size: 1.12rem; border-left: 3px solid var(--accent); padding-left: 14px; margin: 28px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin: 16px 0; }
.card h2 { font: 700 1.2rem/1.3 system-ui, sans-serif; margin: 4px 0 8px; }
.card p { margin: 8px 0; }
.rubrique { display: inline-block; margin: 0; padding: 2px 9px; border-radius: 99px;
  background: var(--chip-bg); color: var(--accent);
  font: 600 .72rem system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; }
.sources, .src, footer { font: .88rem system-ui, sans-serif; color: var(--muted); }
.h-breves { font: 700 1.1rem system-ui, sans-serif; margin-top: 32px; }
.breves { padding-left: 18px; }
.breves li { margin: 6px 0; }
footer { border-top: 1px solid var(--line); margin-top: 36px; padding-top: 14px; }
.tech { font-size: .78rem; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.cols h3 { font: 700 1rem system-ui, sans-serif; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
@media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
